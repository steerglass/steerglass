[package]
name = "steerglass"
version = "0.3.0"
description = "Steerglass - fast multi-cluster Kubernetes desktop client"
authors = ["Davide Bettio"]
license = "Apache-2.0"
repository = "https://github.com/steerglass/steerglass"
homepage = "https://steerglass.com"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "steerglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Mac App Store build: the store updates the app, so the built-in updater is left out.
appstore = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kube = { version = "4.2.0", default-features = false, features = ["runtime", "ws", "client", "rustls-tls", "ring", "gzip"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"
thiserror = "2.0.21"
serde_yaml = "0.9.34"
dirs = "7.0.0"
parking_lot = "0.12.5"
chrono = "0.4.45"
tauri-plugin-dialog = "2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.23.1"
http = "1"

[dev-dependencies]
flate2 = "1.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"


