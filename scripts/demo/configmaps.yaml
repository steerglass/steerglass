---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storefront-edge, namespace: shop, labels: { app: storefront-edge } }
spec:
  replicas: 1
  selector: { matchLabels: { app: storefront-edge } }
  template:
    metadata: { labels: { app: storefront-edge } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          env:
            - name: LOG_LEVEL
              valueFrom: { configMapKeyRef: { name: storefront-config, key: LOG_LEVEL } }
          volumeMounts:
            - { name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
            - { name: partner-ca, mountPath: /etc/ssl/partner }
          resources: { requests: { cpu: 20m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
      volumes:
        - { name: config, configMap: { name: storefront-config } }
        - { name: partner-ca, configMap: { name: partner-ca } }
