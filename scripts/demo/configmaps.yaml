# ConfigMaps with the kinds of values the detail panel recognises (JSON, YAML, nginx, .env, a
# certificate, binary data) and a workload that uses them, for "Used by".
apiVersion: v1
kind: ConfigMap
metadata: { name: storefront-config, namespace: shop }
data:
  LOG_LEVEL: info
  FEATURE_FLAGS: "checkout-v2,new-search"
  app.json: '{"name":"storefront","currency":"EUR","locales":["en","it","de"],"payments":{"provider":"stripe","retries":3,"timeoutMs":2500},"search":{"engine":"meilisearch","url":"http://search.shop:7700","boost":{"title":3,"tags":1.5}},"cache":{"ttlSeconds":300,"redis":"redis://redis.shop:6379/0"}}'
  application.yaml: |
    server:
      port: 8080
      shutdown: graceful
    spring:
      datasource:
        url: jdbc:postgresql://db.shop:5432/storefront
        hikari:
          maximum-pool-size: 20
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
  defaults.env: |
    # Shared defaults for the storefront containers
    TZ=Europe/Rome
    CART_TTL_HOURS=48
    export CDN_URL="https://cdn.example.com/shop"
    MAX_UPLOAD_MB=10
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      upstream api { server checkout-api.shop:8080; }
      server {
        listen 80;
        gzip on;
        location /api/ { proxy_pass http://api; proxy_read_timeout 30s; }
        location / { root /usr/share/nginx/html; try_files $uri /index.html; }
      }
    }
binaryData:
  favicon.png: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGP4DwAAAQEABRjYTgAAAABJRU5ErkJggg==
---
